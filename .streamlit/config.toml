# METEORWATCH theme. Streamlit reads this file from the folder you run streamlit from.
# Rich styling (fonts, status colours, record sheet) lives in meteorwatch/ui/theme.py.
[theme]
base = "dark"
primaryColor = "#9DB0FF"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#111A31"
textColor = "#F3F5FF"
font = "sans serif"

[server]
headless = true
